name: release-single-exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/Version für Release (z. B. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-single-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Prepare appsettings for CI build
        shell: pwsh
        run: |
          Copy-Item appsettings.template.json src/BpLogViewer.Cli/appsettings.json -Force

      - name: Restore
        # Wichtig: -r win-x64, sonst fehlt der Asset-Eintrag für
        # net8.0/win-x64 und `dotnet publish` bricht mit NETSDK1047 ab.
        # Belt-and-suspenders zum <RuntimeIdentifier>win-x64</RuntimeIdentifier>
        # in der .csproj, damit auch Builds ohne csproj-Änderung funktionieren.
        run: dotnet restore src/BpLogViewer.Cli/BpLogViewer.Cli.csproj -r win-x64

      - name: Build
        run: dotnet build src/BpLogViewer.Cli/BpLogViewer.Cli.csproj -c Release -r win-x64 --no-restore

      - name: Publish single-file exe (win-x64)
        run: >-
          dotnet publish src/BpLogViewer.Cli/BpLogViewer.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o out/win-x64

      - name: Compute version label
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.tag }}'
          } else {
            $v = '${{ github.ref_name }}'
          }
          if ([string]::IsNullOrWhiteSpace($v)) {
            throw 'Version/Tag konnte nicht ermittelt werden.'
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Package zip + sha256
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $zipName = "bp-log-viewer-win-x64-$version.zip"
          $shaName = "$zipName.sha256"

          New-Item -ItemType Directory -Force -Path out\release | Out-Null

          $publishDir = Resolve-Path 'out\win-x64'
          $zipPath = Join-Path (Resolve-Path 'out\release') $zipName

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$zipName" | Set-Content -Encoding UTF8 (Join-Path (Resolve-Path 'out\release') $shaName)

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "sha_path=$(Join-Path (Resolve-Path 'out\release') $shaName)" >> $env:GITHUB_OUTPUT

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha_path }}
